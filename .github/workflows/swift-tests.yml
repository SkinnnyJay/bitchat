name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Swift Tests
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2

      - name: Capture toolchain fingerprints
        id: toolchain
        run: |
          swift_fingerprint="$(swift --version | shasum -a 256 | cut -d' ' -f1)"
          xcode_fingerprint="$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)"
          echo "swift_fingerprint=$swift_fingerprint" >> "$GITHUB_OUTPUT"
          echo "xcode_fingerprint=$xcode_fingerprint" >> "$GITHUB_OUTPUT"

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build artifacts
        id: swiftpm-cache
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.toolchain.outputs.swift_fingerprint }}-${{ steps.toolchain.outputs.xcode_fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.toolchain.outputs.swift_fingerprint }}-${{ steps.toolchain.outputs.xcode_fingerprint }}-
            ${{ runner.os }}-${{ runner.arch }}-swiftpm-

      - name: Build the package
        timeout-minutes: 8
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log

      - name: Run Tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          swift test --parallel --disable-swift-testing -Xswiftc -warnings-as-errors 2>&1 | tee test.log  # so it only runs xctests: https://github.com/swiftlang/swift-package-manager/issues/8529#issuecomment-2815711345

      - name: Publish CI summary
        if: always()
        run: |
          {
            echo "### Swift CI Summary"
            echo ""
            echo "- Swift fingerprint: \`${{ steps.toolchain.outputs.swift_fingerprint }}\`"
            echo "- Xcode fingerprint: \`${{ steps.toolchain.outputs.xcode_fingerprint }}\`"
            echo "- SwiftPM cache hit: \`${{ steps.swiftpm-cache.outputs.cache-hit || 'false' }}\`"
            echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Swift build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-test-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 14
